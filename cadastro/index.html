<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>teatopia</title>
</head>
<body>
    <!-- Parte de cima -->
    <header>
        <img class="vermelha" src="../imagens/cad_peca_vermelha_topo_esquerdo.png" alt="peça vermelha">
        
        <img class="verde" src="../imagens/cad_peca_verde_topo_direito.png" alt="peça verde">
    </header> 
    <!-- Parte Cadastro -->
    <section class="principal">
        <div>
            <img class="logo" src="../imagens/logo.png" alt="logo">
            <div class="cadastro_body">
            <h3>Nome</h3> <p>
            <input id="firstname" type="text" name="firstname" placeholder="Seu nome" required>
            <h3>E-mail</h3> <p>
            <input id="email" type="email" name="email" placeholder="Seu@email.com" required>
            <h3>Senha</h3>
            <input id="senha" type="senha" name="senha" required>
            <h3>Confirmar senha</h3>
            <input id="confirmar senha" type="confirmar senha" name="confirmar senha" required>
    </div>
    </section> 
</body>
</html>
